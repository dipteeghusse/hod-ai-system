name: CI — Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend — Python lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check . --select E,F,W --ignore E501 || true

  frontend-typecheck:
    name: Frontend — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit || true

      - name: Next.js build check
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
        run: |
          node -e "
            const fs = require('fs');
            let c = fs.readFileSync('next.config.js', 'utf8');
            c = c.replace(\"output: 'standalone'\", \"output: 'export'\");
            fs.writeFileSync('next.config.js', c);
          "
          npm run build
