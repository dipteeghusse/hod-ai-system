version: '3.9'

# HOD AI System — Docker Compose
# Usage:
#   1. Copy backend/.env.example → backend/.env and fill API keys
#   2. docker compose up --build
#   3. Open http://localhost:3000

services:

  # ── Backend (FastAPI + LangGraph) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hod-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/hod_system.db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      VECTOR_STORE_PATH: /app/rag/vector_store
    volumes:
      - backend_data:/app/data
      - vector_store:/app/rag/vector_store
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - hod_network

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
    container_name: hod-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hod_network

  # ── Redis (task queue / caching) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hod-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hod_network

  # ── Nginx reverse proxy (optional, for production) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hod_network
    profiles:
      - production   # only starts with: docker compose --profile production up

volumes:
  backend_data:
  vector_store:
  redis_data:

networks:
  hod_network:
    driver: bridge
